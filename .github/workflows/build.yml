name: Build Kính (APK + EXE)

# Chạy mỗi khi push code lên nhánh main, hoặc bấm chạy tay từ tab Actions.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write  # cần quyền này để tạo/ghi đè Release

jobs:
  build-android:
    name: Build APK (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'
          cache: true

      - name: Sinh lại thư mục android/ đúng chuẩn phiên bản Flutter đang dùng
        run: |
          rm -rf android
          flutter create --platforms=android --project-name=kinh --org=com.bachdathan .

      - name: Áp icon riêng của app (legacy + adaptive)
        run: |
          set -euo pipefail
          RES=android/app/src/main/res
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-${dir}"
            cp "assets/icon_${dir}.png" "$RES/mipmap-${dir}/ic_launcher.png"
            # foreground dens (dùng cùng PNG — đủ đẹp trên launcher hiện đại)
            cp "assets/icon_${dir}.png" "$RES/mipmap-${dir}/ic_launcher_foreground.png" 2>/dev/null || true
          done
          # Adaptive icon (Android 8+)
          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/values"
          if [ -f assets/ic_launcher.xml ]; then
            cp assets/ic_launcher.xml "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          else
            cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          fi
          # color background
          if ! grep -q ic_launcher_background "$RES/values/colors.xml" 2>/dev/null; then
            if [ -f "$RES/values/colors.xml" ]; then
              sed -i 's|</resources>|    <color name="ic_launcher_background">#0C1228</color>\n</resources>|' "$RES/values/colors.xml"
            else
              printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <color name="ic_launcher_background">#0C1228</color>' '</resources>' > "$RES/values/colors.xml"
            fi
          fi
          echo "Launcher icons applied (legacy + adaptive)"

      - name: Đặt tên hiển thị app là "Kính"
        shell: bash
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Kính"/' android/app/src/main/AndroidManifest.xml

      # Bắt buộc: release APK cần INTERNET — thiếu thì WebView báo net::ERR_CACHE_MISS
      - name: Thêm quyền INTERNET vào AndroidManifest (release)
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "INTERNET permission already present"
          else
            # Chèn 2 permission ngay sau dòng mở thẻ manifest
            awk '
              /<manifest[ >]/ && !done {
                print
                print "    <uses-permission android:name=\"android.permission.INTERNET\"/>"
                print "    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>"
                done=1
                next
              }
              { print }
            ' "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
            echo "Inserted INTERNET permission"
          fi
          echo "=== AndroidManifest permissions ==="
          grep -E 'uses-permission' "$MANIFEST" || true

      - name: Tải dependencies
        run: flutter pub get

      - name: Cấu hình ký release APK (KEYSTORE secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEYSTORE_ALIAS:-}" ]; then
            echo "::error::Thiếu KEYSTORE_* secrets."
            exit 1
          fi
          KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          mkdir -p android/app

          # Decode base64 an toàn (bỏ whitespace/newline trong secret)
          python3 - <<'PY'
          import os, base64, re, pathlib
          raw = os.environ["KEYSTORE_BASE64"]
          cleaned = re.sub(r"\s+", "", raw)
          data = base64.b64decode(cleaned)
          path = pathlib.Path("android/app/kinh-release.jks")
          path.write_bytes(data)
          print(f"keystore bytes={len(data)}")
          if len(data) < 500:
              raise SystemExit(f"keystore too small ({len(data)} bytes) — KEYSTORE_BASE64 bị cắt hoặc sai")
          print(f"keystore magic={data[:4].hex()}")
          PY

          test -s android/app/kinh-release.jks
          ls -la android/app/kinh-release.jks

          printf '%s\n' \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyPassword=$KEY_PASS" \
            "keyAlias=$KEYSTORE_ALIAS" \
            "storeFile=kinh-release.jks" \
            > android/app/key.properties
          cp android/app/key.properties android/key.properties
          cp android/app/kinh-release.jks android/kinh-release.jks

          echo "=== gradle files ==="
          ls -la android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true
          python3 tool/ci_inject_signing.py | tee /tmp/inject.log
          grep -q 'SIGNING_INJECT=ok' /tmp/inject.log
          if [ -f android/app/build.gradle.kts ]; then
            grep -q 'getByName("release")' android/app/build.gradle.kts
            echo "Verified KTS release signing"
          else
            grep -q 'signingConfigs.release' android/app/build.gradle
            echo "Verified Groovy release signing"
          fi

          if keytool -list -storetype PKCS12 -keystore android/app/kinh-release.jks -storepass "$KEYSTORE_PASSWORD" >/tmp/kt.txt 2>&1; then
            echo "Opened as PKCS12"
          elif keytool -list -storetype JKS -keystore android/app/kinh-release.jks -storepass "$KEYSTORE_PASSWORD" >/tmp/kt.txt 2>&1; then
            echo "Opened as JKS"
          else
            echo "::error::Không mở được keystore (EOF/sai password/base64 hỏng)."
            cat /tmp/kt.txt || true
            echo "Tạo lại KEYSTORE_BASE64 bằng: python3 -c \"import base64,pathlib;print(base64.b64encode(pathlib.Path('kinh-release.jks').read_bytes()).decode())\""
            exit 1
          fi
          cat /tmp/kt.txt
          if ! grep -q "$KEYSTORE_ALIAS" /tmp/kt.txt; then
            echo "::error::Alias không khớp KEYSTORE_ALIAS=$KEYSTORE_ALIAS"
            exit 1
          fi
          echo "Release signing configured."

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Xác minh APK không phải debug key
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          AS=""
          command -v apksigner >/dev/null 2>&1 && AS=apksigner || true
          if [ -z "$AS" ] && [ -n "${ANDROID_HOME:-}" ]; then
            AS=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort | tail -1 || true)
          fi
          if [ -z "$AS" ]; then
            echo "apksigner not found — skip"
            exit 0
          fi
          "$AS" verify --print-certs "$APK" | tee /tmp/cert.txt
          if grep -qi 'Android Debug' /tmp/cert.txt; then
            echo "::error::APK signed with DEBUG key — cannot install over release"
            exit 1
          fi
          echo "Cert fingerprint (compare with keytool on your jks):"
          grep -i 'SHA-256' /tmp/cert.txt || true

      - name: Đổi tên APK cho dễ nhận diện
        run: cp build/app/outputs/flutter-apk/app-release.apk Kinh.apk

      - name: Lưu APK làm artifact tạm
        uses: actions/upload-artifact@v4
        with:
          name: kinh-apk
          path: Kinh.apk

  build-windows:
    name: Build EXE (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'
          cache: true

      - name: Bật hỗ trợ Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Sinh thư mục windows/ đúng chuẩn phiên bản Flutter đang dùng
        shell: bash
        run: |
          rm -rf windows
          flutter create --platforms=windows --project-name=kinh .

      - name: Tải dependencies
        run: flutter pub get

      - name: Build EXE (release)
        run: flutter build windows --release

      - name: Đóng gói thư mục build thành zip
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Kinh-Windows.zip

      - name: Lưu EXE làm artifact tạm
        uses: actions/upload-artifact@v4
        with:
          name: kinh-windows
          path: Kinh-Windows.zip

  release:
    name: Publish lên GitHub Releases
    needs: [ build-android, build-windows ]
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 + token: đủ để pull/push main an toàn
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tải lại APK
        uses: actions/download-artifact@v4
        with:
          name: kinh-apk
          path: dist

      - name: Tải lại EXE
        uses: actions/download-artifact@v4
        with:
          name: kinh-windows
          path: dist

      - name: Đọc số phiên bản từ pubspec.yaml
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//' | sed 's/+.*//' | tr -d '\r')
          echo "version=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test -n "$VERSION"

      - name: Tạo/Cập nhật Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Kính — bản mới nhất (v${{ steps.ver.outputs.version }})"
          body: |
            Bản build tự động mới nhất từ nhánh main.
            - `Kinh.apk` — cài trên Android
            - `Kinh-Windows.zip` — giải nén rồi chạy trên Windows
          files: |
            dist/Kinh.apk
            dist/Kinh-Windows.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Fix OTA: ghi version.json bằng Python (không heredoc YAML) ---
      # Kéo main mới nhất trước khi commit (tránh race khi nhiều push liên tiếp)
      - name: Tự động cập nhật version.json
        env:
          VER: ${{ steps.ver.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Updating version.json -> $VER (sha=$SHA)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Đồng bộ main mới nhất (tránh push đè commit mới hơn)
          git fetch origin main
          git checkout -B main origin/main

          python3 - <<'PY'
          import json, os
          ver = os.environ["VER"].strip()
          sha = os.environ["SHA"].strip()
          data = {
              "version": ver,
              "apk_url": "https://github.com/BachDaThan/K-nh/releases/download/latest/Kinh.apk",
              "exe_url": "https://github.com/BachDaThan/K-nh/releases/download/latest/Kinh-Windows.zip",
              "changelog": f"Bản build tự động từ commit {sha[:7]} (v{ver})",
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print("Wrote version.json:")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

          git add version.json
          if git diff --cached --quiet; then
            echo "version.json không đổi (đã đúng $VER) — bỏ qua commit"
          else
            git commit -m "chore: bump version.json to v${VER} [skip ci]"
            # Retry push nếu race
            for i in 1 2 3; do
              if git push origin main; then
                echo "Pushed version.json OK"
                break
              fi
              echo "Push conflict, rebase và thử lại ($i)..."
              git pull --rebase origin main
              sleep 2
            done
          fi
