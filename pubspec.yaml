name: kinh
description: "Kính - Trình duyệt Dashboard All-in-One, minh bạch và riêng tư."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # WebView engine (Chromium System WebView on Android, WebView2 on Windows)
  flutter_inappwebview: ^6.1.5
  # Local persistence
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  # Utils
  uuid: ^4.5.1
  collection: ^1.18.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
