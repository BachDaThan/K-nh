publish_to: 'none'

version: 0.7.1+12

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_win_floating: ^3.0.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.4
  uuid: ^4.5.1
  collection: ^1.18.0
  intl: ^0.19.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  connectivity_plus: ^6.1.0
  cryptography: ^2.7.0
  installed_apps: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
